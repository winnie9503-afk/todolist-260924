<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡高效代辦清單 - TaskFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.4);
            border-radius: 20px;
        }
        .task-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-300 flex flex-col justify-between">

    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-check-double text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">TaskFlow</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400" id="currentDateStr">載入日期中...</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="themeToggleBtn" title="切換深色/淺色模式" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
                </button>
                <div class="relative group">
                    <button class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors" title="更多選項">
                        <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700 py-2 hidden group-hover:block group-focus-within:block z-40">
                        <button onclick="exportTasks()" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center space-x-2">
                            <i class="fa-solid fa-download text-blue-500"></i>
                            <span>匯出備份 (JSON)</span>
                        </button>
                        <label class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-upload text-emerald-500"></i>
                            <span>匯入備份</span>
                            <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importTasks(event)">
                        </label>
                        <div class="border-t border-slate-100 dark:border-slate-700 my-1"></div>
                        <button onclick="clearAllTasks()" class="w-full text-left px-4 py-2 text-sm text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 flex items-center space-x-2">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>清除所有代辦</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

        <!-- Progress Overview Banner -->
        <section class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-3xl p-6 shadow-xl shadow-blue-500/10 relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
            <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="space-y-1">
                    <span class="text-xs font-semibold tracking-wider uppercase text-blue-200">今日目標進度</span>
                    <h2 class="text-2xl font-bold" id="greetingText">加油！開啟高效的一天</h2>
                    <p class="text-sm text-blue-100" id="statSubtext">已完成 0 個任務，剩餘 0 個未完成</p>
                </div>
                <div class="flex items-center space-x-4 bg-white/10 backdrop-blur-md px-5 py-3 rounded-2xl border border-white/10 self-start sm:self-auto">
                    <div class="text-right">
                        <div class="text-2xl font-black" id="completionRateText">0%</div>
                        <div class="text-xs text-blue-200">總完成率</div>
                    </div>
                    <div class="w-12 h-12 relative flex items-center justify-center">
                        <svg class="w-12 h-12 transform -rotate-90">
                            <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="4" class="text-white/20" fill="transparent" />
                            <circle id="progressCircle" cx="24" cy="24" r="18" stroke="currentColor" stroke-width="4" class="text-white transition-all duration-500" fill="transparent" stroke-dasharray="113.09" stroke-dashoffset="113.09" stroke-linecap="round" />
                        </svg>
                    </div>
                </div>
            </div>
        </section>

        <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 dark:border-slate-700 transition-all">
            <form id="addTaskForm" class="space-y-3">
                <div class="flex items-center space-x-3">
                    <div class="flex-1 relative">
                        <input type="text" id="taskTitleInput" placeholder="新增代辦事項... (按下 Enter 或點擊新增)" required
                            class="w-full pl-4 pr-10 py-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all">
                    </div>
                    <button type="submit" class="px-5 py-3 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-sm font-medium rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center space-x-2 shrink-0">
                        <i class="fa-solid fa-plus"></i>
                        <span class="hidden sm:inline">新增事項</span>
                    </button>
                </div>

                <!-- Expandable Options (Priority, Category, Due Date) -->
                <div class="flex flex-wrap items-center gap-2 pt-1 text-xs">
                    <!-- Priority Select -->
                    <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-700/50 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600">
                        <i class="fa-solid fa-flag text-slate-400"></i>
                        <span class="text-slate-500 dark:text-slate-400">優先權：</span>
                        <select id="taskPriorityInput" class="bg-transparent focus:outline-none font-medium cursor-pointer">
                            <option value="low" class="dark:bg-slate-800">🟢 低優先</option>
                            <option value="medium" selected class="dark:bg-slate-800">🟡 中優先</option>
                            <option value="high" class="dark:bg-slate-800">🔴 高優先</option>
                        </select>
                    </div>

                    <!-- Category Select -->
                    <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-700/50 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600">
                        <i class="fa-solid fa-folder text-slate-400"></i>
                        <span class="text-slate-500 dark:text-slate-400">分類：</span>
                        <select id="taskCategoryInput" class="bg-transparent focus:outline-none font-medium cursor-pointer">
                            <option value="工作" class="dark:bg-slate-800">💼 工作</option>
                            <option value="個人" selected class="dark:bg-slate-800">👤 個人</option>
                            <option value="學習" class="dark:bg-slate-800">📚 學習</option>
                            <option value="購物" class="dark:bg-slate-800">🛒 購物</option>
                            <option value="健康" class="dark:bg-slate-800">🍎 健康</option>
                        </select>
                    </div>

                    <!-- Due Date Input -->
                    <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-700/50 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600">
                        <i class="fa-regular fa-calendar text-slate-400"></i>
                        <span class="text-slate-500 dark:text-slate-400">到期日：</span>
                        <input type="date" id="taskDueDateInput" class="bg-transparent focus:outline-none font-medium cursor-pointer">
                    </div>
                </div>
            </form>
        </section>

        <section class="space-y-3">
            <!-- Filter Tabs & Search -->
            <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                <!-- Status Tabs -->
                <div class="flex items-center bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl text-xs font-medium self-start">
                    <button onclick="setFilter('all')" id="tab-all" class="px-3.5 py-1.5 rounded-lg transition-all tab-btn active-tab">全部 <span id="count-all" class="ml-1 opacity-70">0</span></button>
                    <button onclick="setFilter('active')" id="tab-active" class="px-3.5 py-1.5 rounded-lg transition-all tab-btn">進行中 <span id="count-active" class="ml-1 opacity-70">0</span></button>
                    <button onclick="setFilter('completed')" id="tab-completed" class="px-3.5 py-1.5 rounded-lg transition-all tab-btn">已完成 <span id="count-completed" class="ml-1 opacity-70">0</span></button>
                </div>

                <!-- Search and Secondary Filters -->
                <div class="flex items-center space-x-2 flex-1 md:max-w-xs">
                    <div class="relative w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋代辦事項..." 
                            class="w-full pl-8 pr-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <select id="sortSelect" onchange="handleSort()" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shrink-0">
                        <option value="created-desc">最新建立</option>
                        <option value="created-asc">最早建立</option>
                        <option value="due-asc">最近到期</option>
                        <option value="priority-desc">優先權高到低</option>
                    </select>
                </div>
            </div>

            <!-- Secondary Category Quick Filter Badges -->
            <div class="flex items-center space-x-1.5 overflow-x-auto py-1 custom-scrollbar text-xs">
                <span class="text-slate-400 font-medium shrink-0 mr-1"><i class="fa-solid fa-filter text-2xs"></i> 分類：</span>
                <button onclick="setCategoryFilter('all')" class="cat-filter-btn active-cat border px-2.5 py-1 rounded-lg shrink-0" data-cat="all">全部</button>
                <button onclick="setCategoryFilter('工作')" class="cat-filter-btn border px-2.5 py-1 rounded-lg shrink-0" data-cat="工作">💼 工作</button>
                <button onclick="setCategoryFilter('個人')" class="cat-filter-btn border px-2.5 py-1 rounded-lg shrink-0" data-cat="個人">👤 個人</button>
                <button onclick="setCategoryFilter('學習')" class="cat-filter-btn border px-2.5 py-1 rounded-lg shrink-0" data-cat="學習">📚 學習</button>
                <button onclick="setCategoryFilter('購物')" class="cat-filter-btn border px-2.5 py-1 rounded-lg shrink-0" data-cat="購物">🛒 購物</button>
                <button onclick="setCategoryFilter('健康')" class="cat-filter-btn border px-2.5 py-1 rounded-lg shrink-0" data-cat="健康">🍎 健康</button>
            </div>
        </section>

        <section class="space-y-3">
            <div id="taskList" class="space-y-2.5 min-h-[200px]">
                <!-- Tasks will be dynamically injected here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center bg-white dark:bg-slate-800/50 rounded-2xl border border-dashed border-slate-200 dark:border-slate-700">
                <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-700/50 flex items-center justify-center text-slate-400 text-2xl mb-3">
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <h3 class="font-medium text-slate-600 dark:text-slate-300">目前沒有符合條件的代辦事項</h3>
                <p class="text-xs text-slate-400 mt-1">試著新增一個新任務，或切換搜尋條件吧！</p>
            </div>
        </section>

        <section class="flex flex-wrap items-center justify-between gap-3 bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400">
            <div class="flex items-center space-x-2">
                <span id="remainingCountText">未完成：0 項</span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="clearCompletedTasks()" class="hover:text-rose-500 transition-colors flex items-center space-x-1">
                    <i class="fa-regular fa-trash-can"></i>
                    <span>清除已完成項目</span>
                </button>
            </div>
        </section>
    </main>

    <!-- Footer Footer Information -->
    <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200/60 dark:border-slate-800">
        <p>TaskFlow 代辦清單 — 本地數據將自動儲存於瀏覽器 LocalStorage</p>
    </footer>

    <!-- Edit Task Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700 space-y-4 animate-in fade-in zoom-in duration-200">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-blue-500"></i>
                    <span>編輯代辦事項</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="editTaskForm" onsubmit="saveModalEdit(event)" class="space-y-4">
                <input type="hidden" id="editTaskId">
                
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">任務名稱</label>
                    <input type="text" id="editTaskTitle" required
                        class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">優先權</label>
                        <select id="editTaskPriority" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="low">🟢 低優先</option>
                            <option value="medium">🟡 中優先</option>
                            <option value="high">🔴 高優先</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">分類</label>
                        <select id="editTaskCategory" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="工作">💼 工作</option>
                            <option value="個人">👤 個人</option>
                            <option value="學習">📚 學習</option>
                            <option value="購物">🛒 購物</option>
                            <option value="健康">🍎 健康</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">到期日</label>
                    <input type="date" id="editTaskDueDate" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-xl text-xs bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-200">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-xl text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-md shadow-blue-500/20">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Popup -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center space-x-2 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">提示訊息</span>
    </div>

    <script>
        const STORAGE_KEY = 'taskflow_todos_v1';
        const THEME_KEY = 'taskflow_theme';

        // Safe Storage Wrapper to handle browser permissions and iframe restrictions gracefully
        const SafeStorage = {
            getItem(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    console.warn('LocalStorage access restricted, falling back to memory:', e);
                    return this._memoryStore ? this._memoryStore[key] || null : null;
                }
            },
            setItem(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    console.warn('LocalStorage save failed:', e);
                    if (!this._memoryStore) this._memoryStore = {};
                    this._memoryStore[key] = value;
                }
            },
            removeItem(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    if (this._memoryStore) delete this._memoryStore[key];
                }
            }
        };

        let tasks = [];
        let currentFilter = 'all'; // 'all', 'active', 'completed'
        let currentCategory = 'all';
        let searchQuery = '';
        let sortBy = 'created-desc';

        // DOM Element Cache
        let taskListEl, emptyStateEl, addTaskForm, taskTitleInput, taskPriorityInput, taskCategoryInput, taskDueDateInput;

        function initApp() {
            taskListEl = document.getElementById('taskList');
            emptyStateEl = document.getElementById('emptyState');
            addTaskForm = document.getElementById('addTaskForm');
            taskTitleInput = document.getElementById('taskTitleInput');
            taskPriorityInput = document.getElementById('taskPriorityInput');
            taskCategoryInput = document.getElementById('taskCategoryInput');
            taskDueDateInput = document.getElementById('taskDueDateInput');

            // Setup Date display
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateEl = document.getElementById('currentDateStr');
            if (dateEl) dateEl.innerText = now.toLocaleDateString('zh-TW', options);

            // Load theme preference
            initTheme();

            // Load tasks from LocalStorage
            loadTasks();

            // Setup Form Submit Listener
            if (addTaskForm) {
                addTaskForm.addEventListener('submit', handleAddTask);
            }

            // Initial Render
            render();
        }

        // Ensure robust launch regardless of script load timing
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function initTheme() {
            const savedTheme = SafeStorage.getItem(THEME_KEY);
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            const themeBtn = document.getElementById('themeToggleBtn');
            if (themeBtn) {
                themeBtn.onclick = () => {
                    document.documentElement.classList.toggle('dark');
                    const isDark = document.documentElement.classList.contains('dark');
                    SafeStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
                    showToast(isDark ? '已切換至深色模式' : '已切換至淺色模式');
                };
            }
        }

        function saveTasks() {
            SafeStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function loadTasks() {
            const data = SafeStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    tasks = JSON.parse(data);
                } catch (e) {
                    console.error("Failed to parse LocalStorage data:", e);
                    tasks = [];
                }
            } else {
                // Initialize empty array on first load
                tasks = [];
                saveTasks();
            }
        }

        function getTodayString() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function handleAddTask(e) {
            e.preventDefault();
            const title = taskTitleInput.value.trim();
            if (!title) return;

            const newTask = {
                id: Date.now().toString(),
                title: title,
                completed: false,
                priority: taskPriorityInput.value,
                category: taskCategoryInput.value,
                dueDate: taskDueDateInput.value,
                createdAt: Date.now()
            };

            tasks.unshift(newTask);
            saveTasks();
            render();

            // Reset inputs
            taskTitleInput.value = '';
            taskDueDateInput.value = '';
            showToast("成功建立代辦事項！");
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();

                if (task.completed) {
                    checkAllCompletedCelebration();
                }
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
            showToast("已刪除該代辦事項");
        }

        function clearCompletedTasks() {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast("目前沒有已完成的項目可清除", "info");
                return;
            }
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            render();
            showToast(`已清除 ${completedCount} 個已完成項目`);
        }

        function clearAllTasks() {
            if (tasks.length === 0) {
                showToast("清單已經是空的了", "info");
                return;
            }
            if (confirm("確定要刪除所有代辦事項嗎？此操作無法復原。")) {
                tasks = [];
                saveTasks();
                render();
                showToast("已清除所有項目");
            }
        }

        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('editTaskId').value = task.id;
            document.getElementById('editTaskTitle').value = task.title;
            document.getElementById('editTaskPriority').value = task.priority;
            document.getElementById('editTaskCategory').value = task.category;
            document.getElementById('editTaskDueDate').value = task.dueDate || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveModalEdit(e) {
            e.preventDefault();
            const id = document.getElementById('editTaskId').value;
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.title = document.getElementById('editTaskTitle').value.trim();
                task.priority = document.getElementById('editTaskPriority').value;
                task.category = document.getElementById('editTaskCategory').value;
                task.dueDate = document.getElementById('editTaskDueDate').value;

                saveTasks();
                render();
                closeEditModal();
                showToast("已成功更新代辦事項");
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-blue-600', 'dark:text-blue-400');
            });
            const activeTab = document.getElementById(`tab-${filter}`);
            if (activeTab) {
                activeTab.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-blue-600', 'dark:text-blue-400');
            }
            render();
        }

        function setCategoryFilter(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === category) {
                    btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                    btn.classList.remove('border-slate-200', 'dark:border-slate-700', 'text-slate-600', 'dark:text-slate-300');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    btn.classList.add('border-slate-200', 'dark:border-slate-700', 'text-slate-600', 'dark:text-slate-300');
                }
            });
            render();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            render();
        }

        function handleSort() {
            sortBy = document.getElementById('sortSelect').value;
            render();
        }

        function getFilteredAndSortedTasks() {
            return tasks.filter(task => {
                // Filter by Status
                if (currentFilter === 'active' && task.completed) return false;
                if (currentFilter === 'completed' && !task.completed) return false;

                // Filter by Category
                if (currentCategory !== 'all' && task.category !== currentCategory) return false;

                // Filter by Search Query
                if (searchQuery && !task.title.toLowerCase().includes(searchQuery)) return false;

                return true;
            }).sort((a, b) => {
                if (sortBy === 'created-desc') return b.createdAt - a.createdAt;
                if (sortBy === 'created-asc') return a.createdAt - b.createdAt;
                if (sortBy === 'due-asc') {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                }
                if (sortBy === 'priority-desc') {
                    const map = { high: 3, medium: 2, low: 1 };
                    return map[b.priority] - map[a.priority];
                }
                return 0;
            });
        }

        function render() {
            updateDashboard();

            const filteredTasks = getFilteredAndSortedTasks();

            if (filteredTasks.length === 0) {
                taskListEl.innerHTML = '';
                emptyStateEl.classList.remove('hidden');
                emptyStateEl.classList.add('flex');
                return;
            }

            emptyStateEl.classList.add('hidden');
            emptyStateEl.classList.remove('flex');

            const todayStr = getTodayString();

            taskListEl.innerHTML = filteredTasks.map(task => {
                const isOverdue = task.dueDate && task.dueDate < todayStr && !task.completed;
                
                // Badge Styles
                const priorityBadges = {
                    high: '<span class="px-2 py-0.5 rounded-full text-3xs font-semibold bg-rose-100 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400">高優先</span>',
                    medium: '<span class="px-2 py-0.5 rounded-full text-3xs font-semibold bg-amber-100 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400">中優先</span>',
                    low: '<span class="px-2 py-0.5 rounded-full text-3xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">低優先</span>'
                };

                const categoryIcons = {
                    '工作': '💼',
                    '個人': '👤',
                    '學習': '📚',
                    '購物': '🛒',
                    '健康': '🍎'
                };

                return `
                    <div class="task-enter group bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm hover:shadow-md border border-slate-200/80 dark:border-slate-700 flex items-center justify-between gap-3 transition-all ${task.completed ? 'opacity-60 bg-slate-50/50 dark:bg-slate-800/40' : ''}">
                        <div class="flex items-start space-x-3 flex-1 min-w-0">
                            <!-- Checkbox -->
                            <button onclick="toggleTask('${task.id}')" class="mt-0.5 w-5 h-5 rounded-lg border-2 flex items-center justify-center transition-all shrink-0 ${task.completed ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-blue-500'}">
                                ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>

                            <!-- Content -->
                            <div class="space-y-1 flex-1 min-w-0">
                                <p class="text-sm font-medium leading-snug break-words ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}">
                                    ${escapeHtml(task.title)}
                                </p>

                                <div class="flex flex-wrap items-center gap-2 text-xs">
                                    <!-- Priority Badge -->
                                    ${priorityBadges[task.priority]}

                                    <!-- Category -->
                                    <span class="text-3xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400">
                                        ${categoryIcons[task.category] || '📁'} ${task.category}
                                    </span>

                                    <!-- Due Date -->
                                    ${task.dueDate ? `
                                        <span class="text-3xs flex items-center space-x-1 ${isOverdue ? 'text-rose-500 font-bold' : 'text-slate-400'}">
                                            <i class="fa-regular fa-clock"></i>
                                            <span>${task.dueDate} ${isOverdue ? '(逾期)' : ''}</span>
                                        </span>
                                    ` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center space-x-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                            <button onclick="openEditModal('${task.id}')" class="p-2 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-950/40 transition-colors" title="編輯">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" class="p-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors" title="刪除">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateDashboard() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active = total - completed;

            // Text Counts
            document.getElementById('count-all').innerText = total;
            document.getElementById('count-active').innerText = active;
            document.getElementById('count-completed').innerText = completed;
            document.getElementById('remainingCountText').innerText = `未完成：${active} 項`;

            // Percentage
            const rate = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('completionRateText').innerText = `${rate}%`;
            document.getElementById('statSubtext').innerText = `已完成 ${completed} 個任務，剩餘 ${active} 個未完成`;

            // Dynamic Greeting
            const greetingEl = document.getElementById('greetingText');
            if (rate === 100 && total > 0) {
                greetingEl.innerText = "🎉 太棒了！今天的事項全數完成！";
            } else if (rate >= 50) {
                greetingEl.innerText = "👍 進度過半，繼續保持！";
            } else {
                greetingEl.innerText = "加油！開啟高效的一天";
            }

            // Circular Progress Bar SVG Stroke Offset calculation
            // Radius r=18, circumference = 2 * PI * 18 ≈ 113.097
            const circumference = 113.097;
            const offset = circumference - (rate / 100) * circumference;
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
        }

        function exportTasks() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `TaskFlow_Backup_${getTodayString()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("備份檔案已成功下載！");
        }

        function importTasks(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        tasks = importedData;
                        saveTasks();
                        render();
                        showToast("成功匯入代辦資料！");
                    } else {
                        showToast("無效的 JSON 備份檔案格式", "error");
                    }
                } catch (err) {
                    showToast("解析 JSON 檔案失敗", "error");
                }
            };
            reader.readAsText(file);
            // Reset input
            event.target.value = '';
        }

        function checkAllCompletedCelebration() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            if (total > 0 && total === completed && typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        let toastTimeout;
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;

            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-400";
            } else if (type === "info") {
                toastIcon.className = "fa-solid fa-circle-info text-blue-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            clearTimeout(toastTimeout);
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');

            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
